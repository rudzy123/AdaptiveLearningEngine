[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-learning-engine"
version = "0.4.0"
description = "A local adaptive tutor: local RAG, 5-layer evaluation, confidence-based progression, persistent learner state. No external APIs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Core engine is stdlib-only. The API needs FastAPI; everything else is optional.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "pypdf>=4.0", "streamlit>=1.35"]

[project.scripts]
ale = "ale.__main__:main"

[tool.setuptools.packages.find]
include = ["ale*"]

[tool.setuptools.package-data]
"ale.engine" = ["data/*.json", "data/corpus/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
